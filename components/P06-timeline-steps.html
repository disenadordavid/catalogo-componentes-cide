<body>
<div class="hud"><div class="brand">CIDE <em>·</em> PRESET</div><div class="count">P06</div></div>
<main class="container" style="padding-top:110px;padding-bottom:60px">

  <style>
    .tl{position:relative;margin:30px 0;padding-left:30px}
    .tl::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:3px;background:var(--border)}
    .tl-item{position:relative;margin-bottom:26px}
    .tl-item::before{content:'';position:absolute;left:-30px;top:4px;width:16px;height:16px;border-radius:50%;background:var(--brand);border:3px solid var(--bg)}
    .tl-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-m);padding:18px 22px;box-shadow:var(--sh-card)}

    /* Variante PLEGABLE — la que usan los cursos. El cuerpo nace cerrado y cide.js (initTimeline)
       lo abre al clic poniendo max-height = scrollHeight, con el chevron girando.
       Estas tres reglas FALTABAN en el design system, así que cada curso las reescribía a mano en
       su PAGE_CSS (ver cide-production-build/references/hamburger-timeline-2026-08-27.md).
       Markup canónico de la variante plegable:
         <div class="tl-card" role="button" tabindex="0" aria-expanded="false">
           <h3>Paso 1 <span class="chev">▾</span></h3>
           <div class="tl-body"><p class="muted">Contenido literal de la diseñadora.</p></div>
         </div> */
    .tl-body{max-height:0;overflow:hidden;transition:max-height .32s var(--ease)}
    .tl-card .chev{transition:transform var(--t-fast) var(--ease)}
    .tl-card.open .chev{transform:rotate(180deg)}
  </style>
  <p class="kicker">Preset P06 · timeline-steps</p>
  <h2 style="margin:12px 0 6px">Línea de tiempo</h2>
  <p class="muted" style="margin-bottom:8px">Pasos secuenciales con hitos.</p>
  <div class="tl">
    <div class="tl-item"><div class="tl-card"><h3>Paso 1</h3><p class="muted">Contenido literal de la diseñadora.</p></div></div>
    <div class="tl-item"><div class="tl-card"><h3>Paso 2</h3><p class="muted">Contenido literal de la diseñadora.</p></div></div>
    <div class="tl-item"><div class="tl-card"><h3>Paso 3</h3><p class="muted">Contenido literal de la diseñadora.</p></div></div>
  </div>
  
</main>
