<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sliders · P11 · CIDE</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<style></style>
</head>
<body>
<div class="hud"><div class="brand">CIDE <em>·</em> PRESET</div><div class="count">P11</div></div>
<main class="container" style="padding-top:110px;padding-bottom:60px">

  <style>
    .slider-row{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-l);padding:24px;margin:14px 0;box-shadow:var(--sh-card)}
    input[type=range]{width:100%;height:6px;border-radius:99px;background:var(--border);appearance:none;margin-top:14px}
    input[type=range]::-webkit-slider-thumb{appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--bg-strong);cursor:pointer;box-shadow:var(--sh-card)}
    input[type=range]:disabled{opacity:.5}
    .sl-val{font-family:var(--ff-display-heavy);font-size:1.4rem;color:var(--brand)}
  </style>
  <p class="kicker">Preset P11 · slider-input</p>
  <h2 style="margin:12px 0 6px">Controles deslizantes</h2>
  <p class="muted" style="margin-bottom:14px">El estudiante ajusta valores interactivamente.</p>
  <div class="slider-row">
    <label for="s1">Nivel de compromiso: <span class="sl-val" id="v1">50</span>%</label>
    <input type="range" id="s1" min="0" max="100" value="50" oninput="document.getElementById('v1').textContent=this.value">
  </div>
  <div class="slider-row">
    <label for="s2">Presupuesto sugerido: <span class="sl-val" id="v2">30</span></label>
    <input type="range" id="s2" min="0" max="100" value="30" oninput="document.getElementById('v2').textContent=this.value">
  </div>
  
</main>
<script src="../lib/gsap.min.js"></script>
<script src="../lib/ScrollTrigger.min.js"></script>
<script src="../js/cide.js"></script>

<a href="../index.html" style="position:fixed;right:18px;bottom:18px;z-index:250;background:#224a37;color:#fff;font:600 13px system-ui;text-decoration:none;padding:10px 16px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.25)">‹ Volver al catálogo</a>
<script>/* Avisa al catálogo que este demo cargó de verdad (funciona incluso si lo abren
   desde un ZIP, donde el catálogo no puede leer el contenido del iframe). */
try{ if (window.parent !== window) window.parent.postMessage({cideDemo:'P11'}, '*'); }catch(e){}
</script>
</body>
</html>
