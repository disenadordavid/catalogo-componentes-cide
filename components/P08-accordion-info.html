<body>
<div class="hud"><div class="brand">CIDE <em>·</em> PRESET</div><div class="count">P08</div></div>
<main class="container" style="padding-top:110px;padding-bottom:60px">

  <style>
    .acc-item{border:1px solid var(--border);border-radius:var(--radius-m);margin-bottom:10px;background:var(--bg-strong);overflow:hidden}
    .acc-head{width:100%;text-align:left;background:none;border:0;padding:18px 22px;font-size:1rem;font-weight:700;color:var(--text-primary);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
    .acc-head:hover{color:var(--brand)}
    .acc-head .chev{transition:transform var(--t-fast) var(--ease)}
    .acc-item.open .chev{transform:rotate(180deg)}
    .acc-body{max-height:0;overflow:hidden;transition:max-height var(--t-slow) var(--ease)}
    .acc-body-inner{padding:0 22px 20px}
  </style>
  <p class="kicker">Preset P08 · accordion-info</p>
  <h2 style="margin:12px 0 6px">Acordeón</h2>
  <p class="muted" style="margin-bottom:14px">Expande secciones para leer más.</p>
  <div class="acc-item"><button class="acc-head">Sección 1 <span class="chev">▾</span></button><div class="acc-body"><div class="acc-body-inner muted">Contenido literal de la diseñadora.</div></div></div>
  <div class="acc-item"><button class="acc-head">Sección 2 <span class="chev">▾</span></button><div class="acc-body"><div class="acc-body-inner muted">Contenido literal de la diseñadora.</div></div></div>
  <div class="acc-item"><button class="acc-head">Sección 3 <span class="chev">▾</span></button><div class="acc-body"><div class="acc-body-inner muted">Contenido literal de la diseñadora.</div></div></div>
  
</main>
