<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navegación · P01 · CIDE</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<style></style>
</head>
<body>
<div class="hud"><div class="brand">CIDE <em>·</em> PRESET</div><div class="count">P01</div></div>
<main class="container" style="padding-top:110px;padding-bottom:60px">

  <style>
    .progress-track{height:6px;background:var(--border);border-radius:99px;margin:26px 0;overflow:hidden}
    .progress-fill{height:100%;background:var(--brand);width:40%;transition:width var(--t-slow) var(--ease)}
    .screen-demo{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-l);padding:40px;min-height:200px;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-card)}
    .navrow{display:flex;justify-content:space-between;margin-top:22px}
  </style>
  <p class="kicker">Preset P01 · nav-buttons</p>
  <h2 style="margin:12px 0">Navegación con progreso</h2>
  <p class="muted" style="margin-bottom:20px">El patrón de navegación base de toda unidad: anterior/siguiente + progreso + contador.</p>
  <div class="progress-track"><div class="progress-fill" id="pf"></div></div>
  <div class="screen-demo"><h3 id="sl-title" style="text-align:center">Pantalla <span id="num">2</span> de 5</h3></div>
  <div class="navrow">
    <button class="btn" id="prev" onclick="go(-1)">← Anterior</button>
    <button class="btn primary" id="next" onclick="go(1)">Siguiente →</button>
  </div>
  
</main>
<script src="../lib/gsap.min.js"></script>
<script src="../lib/ScrollTrigger.min.js"></script>
<script src="../js/cide.js"></script>
<script>let n=2;const T=5;
 function go(d){n=Math.min(T,Math.max(1,n+d));
  document.getElementById('num').textContent=n;
  document.getElementById('pf').style.width=(n-1)/(T-1)*100+'%';
  document.getElementById('prev').disabled=(n===1);
  document.getElementById('next').disabled=(n===T);
  if(n===T)document.getElementById('next').textContent='Finalizar ✓';
  else document.getElementById('next').textContent='Siguiente →';}
 go(0);</script>

<a href="../index.html" style="position:fixed;right:18px;bottom:18px;z-index:250;background:#224a37;color:#fff;font:600 13px system-ui;text-decoration:none;padding:10px 16px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.25)">‹ Volver al catálogo</a>
<script>/* Avisa al catálogo que este demo cargó de verdad (funciona incluso si lo abren
   desde un ZIP, donde el catálogo no puede leer el contenido del iframe). */
try{ if (window.parent !== window) window.parent.postMessage({cideDemo:'P01'}, '*'); }catch(e){}
</script>
</body>
</html>
