<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drag a categoría · P17 · CIDE</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<style></style>
</head>
<body>
<div class="hud"><div class="brand">CIDE <em>·</em> PRESET</div><div class="count">P17</div></div>
<main class="container" style="padding-top:110px;padding-bottom:60px">

  <style>
    .zones{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
    @media(max-width:820px){.zones{grid-template-columns:1fr}}
    .zone{min-height:140px;border:2px dashed var(--border);border-radius:var(--radius-m);padding:12px;background:var(--bg-elevated)}
    .zone h4{margin-bottom:8px;font-size:.9rem;letter-spacing:.08em}
    .zone.over{border-color:var(--accent);background:var(--ok-bg)}
    .chip{display:inline-block;background:var(--bg-strong);border:1px solid var(--border);border-radius:var(--radius-pill);padding:8px 14px;margin:4px;cursor:grab;user-select:none;box-shadow:var(--sh-card)}
    .chip.dragging{opacity:.4}
    .chip.bad{background:var(--err-bg);border-color:var(--err);color:var(--err)}
    .chip.placed{background:var(--brand);color:var(--text-on-accent);border-color:var(--brand);cursor:default}
  </style>
  <p class="kicker">Preset P17 · drag-to-category</p>
  <h2 style="margin:12px 0 6px">Clasifica cada elemento</h2>
  <p class="muted" style="margin-bottom:8px">Arrastra los elementos (abajo) al contenedor correcto.</p>
  <div id="pool" style="background:var(--bg-strong);border:1px solid var(--border);border-radius:var(--radius-l);padding:16px;margin-bottom:16px">
    <span class="chip" draggable="true" data-cat="valor">Solidaridad</span>
    <span class="chip" draggable="true" data-cat="valor">Equidad</span>
    <span class="chip" draggable="true" data-cat="principio">Adhesión voluntaria</span>
    <span class="chip" draggable="true" data-cat="principio">Control democrático</span>
    <span class="chip" draggable="true" data-cat="valor">Ayuda mutua</span>
  </div>
  <div class="zones">
    <div class="zone" data-zone="valor"><h4>VALORES</h4></div>
    <div class="zone" data-zone="principio"><h4>PRINCIPIOS</h4></div>
    <div class="zone" data-zone="otro"><h4>OTRO</h4></div>
  </div>
  <div class="feedback" id="fbcat" style="margin-top:16px"></div>
  
</main>
<script src="../lib/gsap.min.js"></script>
<script src="../lib/ScrollTrigger.min.js"></script>
<script src="../js/cide.js"></script>
<script>document.addEventListener('DOMContentLoaded',()=>{
 let drag=null;let placed=0;const total=document.querySelectorAll('.chip').length;
 document.querySelectorAll('.chip').forEach(c=>{
  c.addEventListener('dragstart',e=>{drag=c;c.classList.add('dragging')});
  c.addEventListener('dragend',()=>c.classList.remove('dragging'));
 });
 document.querySelectorAll('.zone').forEach(z=>{
  z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over')});
  z.addEventListener('dragleave',()=>z.classList.remove('over'));
  z.addEventListener('drop',e=>{
   e.preventDefault();z.classList.remove('over');if(!drag)return;
   const chip=drag;
   const ok=chip.dataset.cat===z.dataset.zone;
   if(ok){chip.classList.add('placed');chip.draggable=false;z.appendChild(chip);placed++;}else{chip.classList.add('bad');setTimeout(()=>chip.classList.remove('bad'),600);}
   const fb=document.getElementById('fbcat');
   const done=placed===total;
   fb.textContent=done?'¡Todas las clasificaciones correctas!':'Clasificadas: '+placed+' de '+total;
   fb.className='feedback '+(done?'ok':'info');
   drag=null;
  });
 });
});</script>

<a href="../index.html" style="position:fixed;right:18px;bottom:18px;z-index:250;background:#224a37;color:#fff;font:600 13px system-ui;text-decoration:none;padding:10px 16px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.25)">‹ Volver al catálogo</a>
<script>/* Avisa al catálogo que este demo cargó de verdad (funciona incluso si lo abren
   desde un ZIP, donde el catálogo no puede leer el contenido del iframe). */
try{ if (window.parent !== window) window.parent.postMessage({cideDemo:'P17'}, '*'); }catch(e){}
</script>
</body>
</html>
