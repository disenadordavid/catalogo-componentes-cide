<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reproductor · P13 · CIDE</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<style></style>
</head>
<body>
<div class="hud"><div class="brand">CIDE <em>·</em> PRESET</div><div class="count">P13</div></div>
<main class="container" style="padding-top:110px;padding-bottom:60px">

  <style>.fake-video{aspect-ratio:16/9;border-radius:var(--radius-l);border:1px solid var(--border);background:linear-gradient(135deg,var(--bg-elevated),var(--bg-strong));display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-card)}</style>
  <p class="kicker">Preset P13 · media-player</p>
  <h2 style="margin:12px 0 24px">Video / audio con controles CIDE</h2>
  <div class="fake-video"><button style="background:var(--brand);border:0;width:72px;height:72px;border-radius:50%;font-size:1.6rem;color:var(--text-on-accent);cursor:pointer;box-shadow:var(--sh-elevated)" title="Reproducir video" aria-hidden="true" disabled>▶</button></div>
  <div style="margin-top:26px;display:flex;align-items:center;gap:16px">
   <button id="apb" class="btn primary">▶ Reproducir audio</button>
   <audio id="aud" controls style="flex:1"><source src="media/archivo.mp3" type="audio/mpeg">Tu navegador no soporta audio.</audio>
  </div>
  
</main>
<script src="../lib/gsap.min.js"></script>
<script src="../lib/ScrollTrigger.min.js"></script>
<script src="../js/cide.js"></script>
<script>
/* P13 · el botón propio refleja el estado REAL del <audio>: el texto cambia sólo
   cuando el elemento cambia de estado (eventos play/pause). Así no miente si
   play() falla (no hay fuente, el navegador bloquea el autoplay…) y se mantiene
   sincronizado si el alumno usa los controles nativos del reproductor. */
document.addEventListener('DOMContentLoaded',()=>{
 const a = document.getElementById('aud'), b = document.getElementById('apb');
 if(!a || !b) return;
 b.addEventListener('click',()=>{ if(a.paused){ a.play().catch(()=>{}); } else { a.pause(); } });
 a.addEventListener('play', ()=>{ b.textContent = '⏸ Pausar'; });
 a.addEventListener('pause',()=>{ b.textContent = '▶ Reproducir audio'; });
});
</script>

<a href="../index.html" style="position:fixed;right:18px;bottom:18px;z-index:250;background:#224a37;color:#fff;font:600 13px system-ui;text-decoration:none;padding:10px 16px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.25)">‹ Volver al catálogo</a>
<script>/* Avisa al catálogo que este demo cargó de verdad (funciona incluso si lo abren
   desde un ZIP, donde el catálogo no puede leer el contenido del iframe). */
try{ if (window.parent !== window) window.parent.postMessage({cideDemo:'P13'}, '*'); }catch(e){}
</script>
</body>
</html>
