<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarjeta que se voltea · P03 · CIDE</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<style></style>
</head>
<body>
<div class="hud"><div class="brand">CIDE <em>·</em> PRESET</div><div class="count">P03</div></div>
<main class="container" style="padding-top:110px;padding-bottom:60px">

  <style>
    .flip{width:300px;height:200px;perspective:1200px;cursor:pointer;margin:20px auto}
    .flip-inner{position:relative;width:100%;height:100%;transition:transform var(--t-slow) var(--ease);transform-style:preserve-3d}
    .flip.flipped .flip-inner{transform:rotateY(180deg)}
    .flip-face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:center;padding:20px;border-radius:var(--radius-l);border:1px solid var(--border);box-shadow:var(--sh-card);overflow-y:auto;overflow-x:hidden}
    .flip-front{background:var(--bg-elevated)}
    .flip-back{background:var(--brand);color:var(--text-on-accent);transform:rotateY(180deg)}
  </style>
  <p class="kicker">Preset P03 · flip-card</p>
  <h2 style="margin:12px 0 6px">Tarjeta que se voltea</h2>
  <p class="muted" style="margin-bottom:8px">Haz clic para revelar el contenido del reverso.</p>
  <div class="flip">
    <div class="flip-inner">
      <div class="flip-face flip-front"><strong>¿Sabías que...?</strong><br><span class="muted">Toca para descubrir</span></div>
      <div class="flip-face flip-back">Dato clave literal de la diseñadora.</div>
    </div>
  </div>
  
</main>
<script src="../lib/gsap.min.js"></script>
<script src="../lib/ScrollTrigger.min.js"></script>
<script src="../js/cide.js"></script>

<a href="../index.html" style="position:fixed;right:18px;bottom:18px;z-index:250;background:#224a37;color:#fff;font:600 13px system-ui;text-decoration:none;padding:10px 16px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.25)">‹ Volver al catálogo</a>
<script>/* Avisa al catálogo que este demo cargó de verdad (funciona incluso si lo abren
   desde un ZIP, donde el catálogo no puede leer el contenido del iframe). */
try{ if (window.parent !== window) window.parent.postMessage({cideDemo:'P03'}, '*'); }catch(e){}
</script>
</body>
</html>
